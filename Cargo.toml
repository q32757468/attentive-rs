[package]
name = "attentive-notifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Rust notification server and Windows toast dispatcher for Attentive Kit"
license = "MIT"
repository = "https://github.com/q32757468/attentive-rs"
readme = "README.md"
keywords = ["attentive", "notifications", "windows", "toast"]
categories = ["web-programming", "api-bindings"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/**"]

[dependencies]
axum = "0.8"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winrt-toast-reborn = "0.3.8"
